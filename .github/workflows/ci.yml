name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack (dry run — verify packages build correctly)
        run: |
          dotnet pack --configuration Release --no-build \
            /p:Version=0.0.0-ci \
            --output ./nupkgs

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-ci
          path: ./nupkgs/*.nupkg
          retention-days: 3
