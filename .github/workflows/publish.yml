name: publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build --configuration Release --no-restore \
            /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          for proj in \
            src/Streamly.Core/Streamly.Core.csproj \
            src/Streamly.Infrastructure/Streamly.Infrastructure.csproj \
            src/Streamly.Server/Streamly.Server.csproj \
            src/Streamly.Client/Streamly.Client.csproj \
            src/Streamly/Streamly.csproj \
            src/Streamly.Audit/Streamly.Audit.csproj \
            src/Streamly.Monitoring/Streamly.Monitoring.csproj; do
            dotnet pack "$proj" --configuration Release --no-build \
              /p:Version=${{ steps.version.outputs.VERSION }} \
              --output ./nupkgs
          done

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          generate_release_notes: true
